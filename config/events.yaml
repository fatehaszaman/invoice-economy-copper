    label: "onset of observable enforcement inspections"
    basis: "S&P Global reports strict compliance inspections already occurring mid-April"
    url: "https://www.spglobal.com/energy/en/news-research/latest-news/metals/043026-china-tax-compliance-push-tightens-invoice-quotas-slows-copper-cargo-flow"
