name: ci

on:
  push:
  pull_request:
  schedule:
    # Scheduled offline regression only; this does not probe live source schemas.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # lock verification needs commit history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: lint
        run: make lint
      - name: tests
        run: make test
      - name: reproducible reviewer walkthrough
        run: make demo-check
      - name: tracked-file security hygiene
        run: make security
      - name: verify original specification lock
        run: python -c "from pcs.lock import verify_lock; verify_lock()"
      - name: pre-registration ordering
        run: |
          PRE=$(git log --diff-filter=A --format=%ct -- PREREGISTRATION.md | tail -1)
          RES=$(git log --diff-filter=A --format=%ct -- research/ | tail -1)
          echo "prereg=$PRE research=$RES"
          if [ -n "$RES" ] && [ "$PRE" -gt "$RES" ]; then
            echo "FAIL: estimation code predates the pre-registration"; exit 1
          fi
      - name: determinism
        run: bash scripts/check_determinism.sh
