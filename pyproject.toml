[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-economy-copper"
version = "0.1.0"
description = "Ongoing copper-market consistency research with partial ingestion and synthetic validation"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools]
packages = ["pcs", "research", "warehouse", "ingest", "scripts"]

[tool.setuptools.package-data]
warehouse = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
